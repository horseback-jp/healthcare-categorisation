common_session_parameters:
  authorisation_type: ""
  appointment_type: ""
  medical_specialty: ""
  claim_query: ""
  caller_intent: ""
  _action_trigger: ""
  no_match_counter: "0"
  no_input_counter: "0"
  api_failed: "false"

conversations:
  - conversation: scenario_3_claims
    session_parameters: {}
    turns:
      - user: "<event>welcome</event>"
        agent: "Hello, and welcome to Evergreen Healthcare. I'm your digital assistant. How can I help you today?"
      - user: "Hi, I sent in a receipt for some dental work last week and I just want to check the status of my claim."
        agent: "Thank you. I have the details for your Claim query. I am transferring you to our billing and claims team now. Please hold the line."
        tool_calls:
          - action: medical_entity_lookup
            args:
              user_utterance: "Hi, I sent in a receipt for some dental work last week and I just want to check the status of my claim."
          - action: transfer_call
            args:
              transfer_destination: "billing"
              summary:
                $matchType: "ignore"
                $matchValue: ""
                $originalValue: ""
          - action: end_session
            args:
              session_escalated: true
    expectations:
      - "The agent must capture claim query intent without requiring a medical specialty."
      - "The agent must transfer immediately to billing and claims team."
    tags: [P0, NO-GO, claims, no-specialty]
